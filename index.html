<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1f2a24;--mut:#55625a;--ac:#2f7d4f;--bd:#d9d5c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c19;--card:#222924;--tx:#eef2ee;--mut:#a9b5ac;--ac:#6cc58f;--bd:#37403a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c19;--card:#222924;--tx:#eef2ee;--mut:#a9b5ac;--ac:#6cc58f;--bd:#37403a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{max-width:1100px;margin:0 auto;padding:22px 16px 6px;text-align:center}
h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0;color:var(--mut);font-size:.95rem}
.grid{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
figure{margin:0;background:var(--card);border:2px solid var(--tx);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
svg.v{display:block;width:100%;height:auto;border-bottom:2px solid var(--tx)}
figcaption{padding:8px 10px 11px;font-size:.82rem}
figcaption b{display:block;color:var(--ac);margin-bottom:3px;letter-spacing:.03em;font-size:.85rem}
figcaption i{display:block;margin-top:5px;color:var(--mut);font-size:.76rem}
footer{text-align:center;padding:6px 16px 26px;color:var(--mut);font-size:.88rem}
</style>
</head>

<script>
(function(){
var CW=4.9, FS=9.5;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function bubble(o){
  var L=o.l, w=Math.max.apply(null,L.map(function(s){return s.length;}))*CW+18, h=L.length*12+10;
  var x=Math.min(Math.max(o.x-w/2,3),297-w), y=o.y, tx=o.t[0], ty=o.t[1], out="";
  var st='fill="#fff" stroke="#34435a" stroke-width="1.3"';
  if(o.th){
    var cx=x+w/2, cy=y+h;
    out+='<circle cx="'+(cx+(tx-cx)*0.3)+'" cy="'+(cy+(ty-cy)*0.3+3)+'" r="4.5" '+st+'/>';
    out+='<circle cx="'+(cx+(tx-cx)*0.65)+'" cy="'+(cy+(ty-cy)*0.65+2)+'" r="2.8" '+st+'/>';
    out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+Math.min(16,h/2)+'" '+st+'/>';
  } else {
    var bx=Math.min(Math.max(tx,x+14),x+w-14);
    out+='<polygon points="'+(bx-6)+','+(y+h-1)+' '+(bx+6)+','+(y+h-1)+' '+tx+','+ty+'" '+st+'/>';
    out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" '+st+'/>';
    out+='<rect x="'+(bx-5)+'" y="'+(y+h-2)+'" width="10" height="3.200" fill="#fff"/>';
  }
  L.forEach(function(s,i){
    out+='<text x="'+(x+w/2)+'" y="'+(y+5+12*(i+1)-2.500)+'" text-anchor="middle" font-size="'+FS+'" textLength="'+(s.length*CW)+'" lengthAdjust="spacingAndGlyphs" fill="#1b2430" font-family="sans-serif">'+esc(s)+'</text>';
  });
  return out;
}
